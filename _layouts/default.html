<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
</head>
<body>

<header class="site-header">
  <div class="logo">
    <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
  </div>

  <button class="nav-toggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="site-nav">
    <span></span><span></span><span></span>
  </button>

  <nav class="site-nav" id="site-nav">
    <a href="{{ '/' | relative_url }}">Inicio</a>
    <a href="{{ '/galerias/' | relative_url }}">Galerías</a>
    <a href="{{ '/fototerapia/' | relative_url }}">Fototerapia</a>
    <a href="{{ '/sobre-mi/' | relative_url }}">Sobre mí</a>
    <a href="{{ '/contacto/' | relative_url }}">Contacto</a>
  </nav>
</header>

<main class="site-content">
{{ content }}
</main>

<footer class="site-footer">
  <img class="footer-signature" src="{{ '/assets/logo/FIRMA%202025%20copia.png' | relative_url }}" alt="Firma de Tinoco">
  <p>&copy; {{ site.time | date: "%Y" }} {{ site.title }} · Todos los derechos reservados.</p>
</footer>

<script src="{{ '/js/nav.js' | relative_url }}" defer></script>
</body>
</html>
